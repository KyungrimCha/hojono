# 깃허브 페이지 배포: main에 올리면(또는 Actions 탭에서 직접 실행하면)
# tools/build-site.js로 공개할 파일만 골라 _site/를 만들고 그 폴더만 게시한다.
# 처음 한 번: 저장소 Settings → Pages → Source를 "GitHub Actions"로 바꿀 것.
name: 깃허브 페이지 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: pages
        uses: actions/configure-pages@v5
      - name: 공개할 파일만 모으기
        run: node tools/build-site.js
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
